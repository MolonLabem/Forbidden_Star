name: Data and logic checks
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/*.test.cjs
      - run: |
          for file in page/script/*.js tools/*.cjs scripts/*.cjs; do node --check "$file"; done
